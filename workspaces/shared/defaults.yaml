# Defaults set by apply-user-defaults
# https://github.com/zero-sh/apply-user-defaults
# Note: I don't believe apply-user-defaults dicts and arrays

com.apple.desktopservices:
  # Avoid creating .DS_Store files on network volumes
  DSDontWriteNetworkStores: true

  # Avoid creating .DS_Store files on USB stores
  DSDontWriteUSBStores: true

com.googlecode.iterm2:
  # Don’t display the annoying prompt when quitting iTerm
  # Kudos: https://github.com/mathiasbynens/dotfiles/blob/master/.osx
  PromptOnQuit: false

# Apple Finder
com.apple.finder:
  # Kudos: https://github.com/mathiasbynens/dotfiles/blob/main/.macos

  # Allow quitting via ⌘ + Q; doing so will also hide desktop icons
  QuitMenuItem: true

  # Disable window animations and Get Info animations
  DisableAllAnimations: true

  # Show hidden files by default
  AppleShowAllFiles: true

  # Show status bar
  ShowStatusBar: true

  # Show path bar
  ShowPathbar: true

  # Display full POSIX path as Finder window title
  _FXShowPosixPathInTitle: true

  # When performing a search, search the current folder by default
  FXDefaultSearchScope: "SCcf"

  # Disable the warning when changing a file extension
  FXEnableExtensionChangeWarning: false

  # Do not open a new Finder window when a volume is mounted
  OpenWindowForNewRemovableDisk: false

  # Don't show removable media icons on desktop
  ShowRemovableMediaOnDesktop: true

  # Disable showing icons on Desktop
  # Followed by "killall Finder"?
  CreateDesktop: false

  # Use list view in all Finder windows by default
  # Four-letter codes for the other view modes: `icnv`, `clmv`, `Flwv`
  FXPreferredViewStyle: "Nlsv"

  # Disable the warning before emptying the Trash
  WarnOnEmptyTrash: false


com.apple.frameworks.diskimages:
  # Disable disk image verification
  skip-verify: true
  skip-verify-locked: true
  skip-verify-remote: true

  # Do not open a new Finder window when a volume is mounted
  auto-open-ro-root: false
  auto-open-rw-root: false

# Configure Dock
# Kudos:
#   https://github.com/mathiasbynens/dotfiles/blob/master/.osx
#   https://macowners.club/posts/brief-macos-dock-settings-terminal/
#   https://joshtronic.com/2024/12/15/set-dock-icon-size-on-macos-cli/
#
# See also: https://github.com/kcrawford/dockutil
#
com.apple.dock:
  # Put Dock at bottom:
  orientation: bottom

  # Enable highlight hover effect for the grid view of a stack (Dock)
  mouse-over-hilite-stack: true

  # Set the icon size of Dock items to 36 pixels
  tilesize: 36

  # Turn on magnification (options are "yes" or "no")
  magnification: yes

  # Change minimize/maximize window effect
  mineffect: "scale"

  # Do not minimize windows into their application’s icon
  minimize-to-application: false

  # Enable spring loading for all Dock items
  enable-spring-load-actions-on-all-items: true

  # Show indicator lights for open applications in the Dock
  show-process-indicators: true

  # Don’t animate opening applications from the Dock
  launchanim: false

  # Speed up Mission Control animations
  expose-animation-duration: 0.1

  # Don’t group windows by application in Mission Control
  # (i.e. use the old Exposé behavior instead)
  expose-group-by-app: false

  # Don’t show Dashboard as a Space
  dashboard-in-overlay: true

  # Don’t automatically rearrange Spaces based on most recent use
  mru-spaces: false

  # Remove the auto-hiding Dock delay
  autohide-delay: 0.0
  # Remove the animation when hiding/showing the Dock
  autohide-time-modifier: 0.0

  # Automatically hide and show the Dock
  autohide: true

  # Make Dock icons of hidden applications translucent
  showhidden: true

  # Disable the Launchpad gesture (pinch with thumb and three fingers)
  showLaunchpadGestureEnabled: 0

  # Hot corners
  # Possible values:
  #  0: no-op
  #  2: Mission Control
  #  3: Show application windows
  #  4: Desktop
  #  5: Start screen saver
  #  6: Disable screen saver
  #  7: Dashboard
  # 10: Put display to sleep
  # 11: Launchpad
  # 12: Notification Center
  # Top left screen corner → Start screen saver
  wvous-tl-corner: 5
  wvous-tl-modifier: 0
  # Top right screen corner → Disable screen saver
  wvous-tr-corner: 6
  wvous-tr-modifier: 0
  # Bottom left screen corner → Mission Control
  wvous-bl-corner: 2
  wvous-bl-modifier: 0
  # Bottom right screen corner → Mission Control
  wvous-br-corner: 2
  wvous-br-modifier: 0


com.apple.dashboard:
  # Disable Dashboard
  mcx-disabled: true


com.google.Chrome:
  # Disabling swipe to go back/forward. Restart of Chrome required.
  AppleEnableSwipeNavigateWithScrolls: FALSE

com.apple.TimeMachine:
  # Disable Time Machine from prompting to use new Hard Drives for backup
  DoNotOfferNewDisksForBackup: true


NSGlobalDomain:
  # Expand save and print panels by default
  NSNavPanelExpandedStateForSaveMode: true
  PMPrintingExpandedStateForPrint: true
  PMPrintingExpandedStateForPrint2: true

  # Always show scrollbars
  # Possible values: `WhenScrolling`, `Automatic` and `Always`
  AppleShowScrollBars: "Always"

  # Disable “natural” (Lion-style) scrolling
  com.apple.swipescrolldirection: false

  # Finder: show all filename extensions
  AppleShowAllExtensions: true

  # Enable spring loading for directories
  com.apple.springing.enabled: true

  # Remove the spring loading delay for directories
  com.apple.springing.delay: 0.0

